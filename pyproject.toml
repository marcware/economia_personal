[project]
name = "economia-personal"
version = "0.1.0"
description = "App local de economía personal: conexión a ING vía Enable Banking, dashboard mensual y consejos automáticos."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pandas>=2.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "cryptography>=43.0",
    "openpyxl>=3.1",
    "playwright>=1.47",  # scripts/scrape_mediolanum.py, con el Chrome del sistema
    # Trade Republic (API no oficial). Fijado a un commit revisado a mano el 2026-11-11: el
    # PIN solo viaja a api.traderepublic.com. No subir de versión sin revisar el diff.
    "pytr @ git+https://github.com/pytr-org/pytr@85f76576856f0e97c3461a6b16716d6f93b4e62e",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
